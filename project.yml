name: GymApp
options:
  bundleIdPrefix: com.brycehart
  # Claude  Date 07/21/2026
  # 16.1 (was 16.0) for SwiftUI's .fontDesign(_:), which is how the theme's typeface
  # is applied app-wide (see AppFontDesign). 16.0 → 16.1 costs no realistic install
  # base; anyone on 16.0 can update.
  deploymentTarget:
    iOS: "16.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

# Claude  Date 08/04/2026
# ONE explicit, shared scheme — the app. This exists to stop `xcodegen generate`
# from costing you your scheme selection.
#
# Nothing defined schemes before, so Xcode autocreated one per target: GymApp AND
# GymAppWidget. Every regeneration recreates the project, Xcode re-autocreates
# both, and the selection can land on the widget. Running an app-extension scheme
# makes Xcode install the host app and then try to place and attach to the widget
# — which is the "stuck adding widget" hang, and it has nothing to do with the app
# code you were actually trying to debug.
#
# Declaring this here writes a real scheme into xcshareddata, so it's stable and
# first in the list every time. Running it builds the widget too (it's an embedded
# dependency) — you never need to run the widget's own scheme. Add the widget to
# the home screen by hand, as a user would.
#
# To stop Xcode reinventing the widget scheme: Product > Scheme > Manage Schemes,
# untick "Autocreate schemes". That setting lives in xcuserdata, which is not
# generated from this file.
schemes:
  GymApp:
    build:
      targets:
        GymApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  GymApp:
    type: application
    platform: iOS
    sources:
      - path: GymApp
        excludes:
          - "**/.DS_Store"
    # Claude  Date 07/16/2026
    # Home-screen widget extension, embedded into the app's PlugIns folder.
    dependencies:
      - target: GymAppWidget
    # Claude  Date 07/16/2026 last changed: 08/13/2026 by: Claude
    # App Group shared with the widget extension — the app writes WidgetSnapshot
    # (today's calories / focus goal / theme) into this group's UserDefaults and
    # the widget reads it.
    #
    # (08/13) The app target's entitlements are now TWO hand-maintained files
    # selected per configuration (see CODE_SIGN_ENTITLEMENTS under `settings:`
    # below), so the `entitlements:` block that used to generate GymApp.entitlements
    # is gone from this target:
    #
    #   GymApp/GymApp.entitlements       Release — App Group + iCloud KVS
    #   GymApp/GymAppDebug.entitlements  Debug   — App Group only
    #
    # Why they had to split: iCloud key-value storage backs the coin wallet (see
    # CloudWalletSync — coin packs are StoreKit *consumables*, so they're absent from
    # Transaction.currentEntitlements and no "restore purchases" can bring them back;
    # everything else Agil stores is JSON in Documents, which iOS deletes with the
    # app). But a free/personal Apple team cannot provision iCloud at all, so with
    # com.apple.developer.ubiquity-kvstore-identifier present, device debug builds
    # failed to sign before compiling. Release keeps it, so shipping behavior and the
    # "purchased currency may not expire" guarantee are unchanged.
    #
    # Splitting via `settings: configs:` alone does NOT work — an `entitlements:`
    # block here sets CODE_SIGN_ENTITLEMENTS for every configuration and silently
    # overrides the per-config value. Hence both files being explicit and generated
    # by nothing. Add any new entitlement to BOTH files.
    #
    # The widget keeps its generated entitlements block below — App Groups IS
    # supported on a personal team, so that target never had this problem.
    # Claude  Date 06/18/2026
    # Explicit Info.plist (kept at the repo root, outside the GymApp sources glob) so
    # we can add an App Transport Security exception for the local dev backend. We
    # still keep GENERATE_INFOPLIST_FILE: YES below, so Xcode injects all the
    # INFOPLIST_KEY_* values into this file at build time — this only adds ATS.
    info:
      path: Info.plist
      properties:
        # Shown when the app first asks for the camera (barcode scanner in Nutrition).
        NSCameraUsageDescription: Agil uses the camera to scan food barcodes so it can look up nutrition info.
        # Claude  Date 06/30/2026 last changed: 08/20/2026 by: Claude
        # (08/19) AgilBackendBaseURL is GONE. The backend host is now chosen in code, by
        # build configuration, in `enum API` (GymApp/Services/API.swift) — Debug = the
        # devbox over Tailscale, Release = prod. Nothing reads AGIL_BACKEND_BASE_URL any
        # more; don't re-add this key without also changing BackendClient.baseURL back.
        # ⚠️ TEST-ONLY cleartext-HTTP exceptions — MUST be removed/replaced before the
        # production (App Store) release. See [[agil-release-ats-https-checklist]].
        #   - 127.0.0.1 / localhost      : simulator dev against a backend on this Mac
        #   - NSAllowsLocalNetworking    : lets phones reach the Mac on the LAN over plain
        #                                  HTTP (private IP ranges) for the device test
        # (08/20) The Tailscale devbox needs NOTHING here: `tailscale serve` fronts it on
        # 443 with a real Let's Encrypt cert for devbox.taile9efe7.ts.net, so it is plain
        # validating HTTPS. An exception was briefly added for the 100.x IP when that host
        # was going to be cleartext — it is gone, and must not come back.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
        # iOS 14+ prompts for local-network access on first connect to the Mac; this
        # description is required or that request silently fails. (LAN test only.)
        NSLocalNetworkUsageDescription: Agil connects to your Agil server on the local network to sync your profile card and look up foods.
    # Claude  Date 08/03/2026
    # Point the Run action at the local StoreKit configuration so coin packs are
    # buyable in the simulator without App Store Connect (which can't even host the
    # products until the Paid Apps agreement is active). Declared here rather than
    # set in Xcode's scheme editor because `xcodegen generate` rewrites the scheme
    # and would silently drop it every time.
    scheme:
      storeKitConfiguration: Agil.storekit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brycehart.gymapp
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # CLAUDE  Date 09/03/2026
        # Themed alternate app icons — one per paid built-in theme (see ThemeIcon.swift).
        # These two settings are what make the asset-catalog compiler emit CFBundleIcons /
        # CFBundleAlternateIcons into the built Info.plist; setAlternateIconName can only
        # name an icon declared here. Declared in project.yml and NOT in the root
        # Info.plist because xcodegen rewrites that file from `info.properties` on every
        # generate. Classic isn't listed: it's the primary AppIcon.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Midnight AppIcon-DeepSea AppIcon-Sunset AppIcon-Leaf AppIcon-Woods"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # CLAUDE  Date 09/04/2026
        # Portrait-only. With no orientation key at all, iOS defaults an iPhone app to
        # portrait + both landscapes, so testers with rotation lock off saw Agil flip
        # sideways (no screen is laid out for it). Listing only the portrait orientation
        # here makes UIKit refuse every rotation app-wide — no per-view work needed.
        # Side effect: upside-down is excluded too (iPhone never honors it anyway).
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Display name shown on the home screen / app switcher / Settings.
        # The internal target/module stays "GymApp" (renaming the Swift module is
        # invasive and offers no user-facing benefit — only this name is seen).
        INFOPLIST_KEY_CFBundleDisplayName: Agil
        # Device signing: Xcode manages certs/profiles automatically. Set your
        # team in Xcode (Signing & Capabilities) or bake DEVELOPMENT_TEAM here so
        # it survives `xcodegen generate`.
        CODE_SIGN_STYLE: Automatic
        # Bryce Hart's personal Apple team, baked in so `xcodegen generate` doesn't
        # wipe the team selection (a regenerate was resetting it, which broke device
        # builds with "Signing requires a development team"). Value = the OU of the
        # "Apple Development: bryce.hart23@gmail.com" certificate.
        DEVELOPMENT_TEAM: 6XTP9P5C7M
      # Claude  Date 08/13/2026
      # Per-config entitlements — see the long note on the target above for why.
      # Debug drops iCloud so device builds sign on a personal team; Release keeps
      # it. Set here rather than in Config/*.xcconfig because a target-level build
      # setting overrides an xcconfig, so the xcconfig version would be silently
      # ignored (the same trap the AGIL_BACKEND_BASE_URL note below warns about).
      #
      # Once the paid Developer Program membership is active, collapse these back to
      # one file and delete GymAppDebug.entitlements — debug builds should be
      # exercising the real entitlement set.
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: GymApp/GymAppDebug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: GymApp/GymApp.entitlements
    # Claude  Date 06/30/2026 last changed: 08/19/2026 by: Claude
    # Per-configuration xcconfigs. These no longer carry the backend host — that moved
    # into `enum API` (GymApp/Services/API.swift) on 08/19. Kept wired up because the
    # files are still the right home for any future per-config build setting.
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig

  # Claude  Date 07/16/2026
  # Home-screen widget (WidgetKit app extension): today's calories, the first
  # Focus goal, and the Agil mark, tinted with the active theme. Reads its data
  # from the App Group snapshot the app writes (see WidgetSnapshot.swift). The
  # extension compiles a small set of the app's files directly — model/theme
  # types it renders with — because an app extension can't import the app's code.
  GymAppWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GymAppWidget
        excludes:
          - "**/.DS_Store"
      # Shared with the app target (compiled into both):
      - GymApp/Shared/WidgetSnapshot.swift
      - GymApp/Models/NutrientFocusGoal.swift
      - GymApp/Models/Nutrients.swift
      - GymApp/Models/NutritionGoals.swift
      - GymApp/Theme/AppTheme.swift
      - GymApp/Theme/Color+Hex.swift
      - GymApp/Theme/MacroPalette.swift
    # Same App Group as the app — this is the widget's read side.
    entitlements:
      path: GymAppWidget/GymAppWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.brycehart.gymapp
    # Explicit Info.plist for the NSExtension declaration (what makes this bundle
    # a WidgetKit extension); INFOPLIST_KEY_* values still merge in at build time
    # via GENERATE_INFOPLIST_FILE, matching the app target's pattern.
    info:
      path: GymAppWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brycehart.gymapp.widget
        GENERATE_INFOPLIST_FILE: YES
        # Shown in the widget gallery / under the widget on the home screen.
        INFOPLIST_KEY_CFBundleDisplayName: Agil
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6XTP9P5C7M
