name: GymApp
options:
  bundleIdPrefix: com.brycehart
  # Claude  Date 07/21/2026
  # 16.1 (was 16.0) for SwiftUI's .fontDesign(_:), which is how the theme's typeface
  # is applied app-wide (see AppFontDesign). 16.0 → 16.1 costs no realistic install
  # base; anyone on 16.0 can update.
  deploymentTarget:
    iOS: "16.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

# Claude  Date 08/04/2026
# ONE explicit, shared scheme — the app. This exists to stop `xcodegen generate`
# from costing you your scheme selection.
#
# Nothing defined schemes before, so Xcode autocreated one per target: GymApp AND
# GymAppWidget. Every regeneration recreates the project, Xcode re-autocreates
# both, and the selection can land on the widget. Running an app-extension scheme
# makes Xcode install the host app and then try to place and attach to the widget
# — which is the "stuck adding widget" hang, and it has nothing to do with the app
# code you were actually trying to debug.
#
# Declaring this here writes a real scheme into xcshareddata, so it's stable and
# first in the list every time. Running it builds the widget too (it's an embedded
# dependency) — you never need to run the widget's own scheme. Add the widget to
# the home screen by hand, as a user would.
#
# To stop Xcode reinventing the widget scheme: Product > Scheme > Manage Schemes,
# untick "Autocreate schemes". That setting lives in xcuserdata, which is not
# generated from this file.
schemes:
  GymApp:
    build:
      targets:
        GymApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  GymApp:
    type: application
    platform: iOS
    sources:
      - path: GymApp
        excludes:
          - "**/.DS_Store"
    # Claude  Date 07/16/2026
    # Home-screen widget extension, embedded into the app's PlugIns folder.
    dependencies:
      - target: GymAppWidget
    # Claude  Date 07/16/2026
    # App Group shared with the widget extension — the app writes WidgetSnapshot
    # (today's calories / focus goal / theme) into this group's UserDefaults and
    # the widget reads it. xcodegen writes this entitlements file on generate.
    entitlements:
      path: GymApp/GymApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.brycehart.gymapp
    # Claude  Date 06/18/2026
    # Explicit Info.plist (kept at the repo root, outside the GymApp sources glob) so
    # we can add an App Transport Security exception for the local dev backend. We
    # still keep GENERATE_INFOPLIST_FILE: YES below, so Xcode injects all the
    # INFOPLIST_KEY_* values into this file at build time — this only adds ATS.
    info:
      path: Info.plist
      properties:
        # Shown when the app first asks for the camera (barcode scanner in Nutrition).
        NSCameraUsageDescription: Agil uses the camera to scan food barcodes so it can look up nutrition info.
        # Claude  Date 06/30/2026
        # Backend base URL, injected from the AGIL_BACKEND_BASE_URL build setting (set
        # per build configuration below) and read at runtime by BackendClient.baseURL.
        # Switching LAN <-> prod is now a config change, not a code edit: pick the build
        # configuration (Debug = LAN, Release = prod host).
        AgilBackendBaseURL: $(AGIL_BACKEND_BASE_URL)
        # ⚠️ TEST-ONLY cleartext-HTTP exceptions — MUST be removed/replaced before the
        # production (App Store) release. Production serves the backend over HTTPS, which
        # needs NONE of this (and the Release AGIL_BACKEND_BASE_URL below must point at
        # that HTTPS host). See [[agil-release-ats-https-checklist]].
        #   - 127.0.0.1 / localhost      : simulator dev against the local backend
        #   - NSAllowsLocalNetworking    : lets phones reach the Mac on the LAN over plain
        #                                  HTTP (private IP ranges) for the device test
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
        # iOS 14+ prompts for local-network access on first connect to the Mac; this
        # description is required or that request silently fails. (LAN test only.)
        NSLocalNetworkUsageDescription: Agil connects to your Agil server on the local network to sync your profile card and look up foods.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brycehart.gymapp
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Display name shown on the home screen / app switcher / Settings.
        # The internal target/module stays "GymApp" (renaming the Swift module is
        # invasive and offers no user-facing benefit — only this name is seen).
        INFOPLIST_KEY_CFBundleDisplayName: Agil
        # Device signing: Xcode manages certs/profiles automatically. Set your
        # team in Xcode (Signing & Capabilities) or bake DEVELOPMENT_TEAM here so
        # it survives `xcodegen generate`.
        CODE_SIGN_STYLE: Automatic
        # Bryce Hart's personal Apple team, baked in so `xcodegen generate` doesn't
        # wipe the team selection (a regenerate was resetting it, which broke device
        # builds with "Signing requires a development team"). Value = the OU of the
        # "Apple Development: bryce.hart23@gmail.com" certificate.
        DEVELOPMENT_TEAM: 6XTP9P5C7M
    # Claude  Date 06/30/2026 last changed: 08/04/2026 by: Claude
    # Backend host per build configuration (feeds AgilBackendBaseURL above).
    # (08/04) AGIL_BACKEND_BASE_URL moved OUT of `settings: configs:` and into these
    # xcconfig files, so changing the host is a one-line edit that Xcode picks up on
    # the next Run — no project.yml change and no `xcodegen generate`.
    # Do NOT re-add AGIL_BACKEND_BASE_URL under `settings:` below: a target-level
    # build setting overrides an xcconfig, so it would silently shadow these files.
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig

  # Claude  Date 07/16/2026
  # Home-screen widget (WidgetKit app extension): today's calories, the first
  # Focus goal, and the Agil mark, tinted with the active theme. Reads its data
  # from the App Group snapshot the app writes (see WidgetSnapshot.swift). The
  # extension compiles a small set of the app's files directly — model/theme
  # types it renders with — because an app extension can't import the app's code.
  GymAppWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GymAppWidget
        excludes:
          - "**/.DS_Store"
      # Shared with the app target (compiled into both):
      - GymApp/Shared/WidgetSnapshot.swift
      - GymApp/Models/NutrientFocusGoal.swift
      - GymApp/Models/Nutrients.swift
      - GymApp/Models/NutritionGoals.swift
      - GymApp/Theme/AppTheme.swift
      - GymApp/Theme/Color+Hex.swift
      - GymApp/Theme/MacroPalette.swift
    # Same App Group as the app — this is the widget's read side.
    entitlements:
      path: GymAppWidget/GymAppWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.brycehart.gymapp
    # Explicit Info.plist for the NSExtension declaration (what makes this bundle
    # a WidgetKit extension); INFOPLIST_KEY_* values still merge in at build time
    # via GENERATE_INFOPLIST_FILE, matching the app target's pattern.
    info:
      path: GymAppWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brycehart.gymapp.widget
        GENERATE_INFOPLIST_FILE: YES
        # Shown in the widget gallery / under the widget on the home screen.
        INFOPLIST_KEY_CFBundleDisplayName: Agil
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6XTP9P5C7M
